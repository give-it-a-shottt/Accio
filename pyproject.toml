[project]
name = "accio-api"
version = "0.1.0"
description = "Accio 자연어 검색 쇼핑몰 백엔드 (FastAPI · Gemini · Supabase)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "uvicorn>=0.32",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 120
src = ["backend", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
